# Source of docs/project/roadmap.md (tools/docs/roadmap.py builds the page; `uv run cog -r -I tools/docs
# docs/project/roadmap.md`). Keep it short: one line of state per item, the numbers live in performance.md and the
# CHANGELOG. tools/docs/check.py fails when `updated` is more than 7 days older than the last commit of code.
updated = "2026-11-22"

[[section]]
title = "Nothing hangs the GPU"
items = [
  "GPU hangs on some AMD drivers: upload batches are split; breadcrumbs and `VK_EXT_device_fault` are in place to find the cause of the rest.",
  "Less GPU memory: races run in 4 GiB with every texture; sparse tiles above 768 MiB are next.",
]

[[section]]
title = "The picture as on the console"
items = [
  "Three shader translator bugs left (found by comparing with another Switch 2 port).",
  "The kart's shadow misses a frame now and then.",
  "Zero Vulkan validation errors: none from boot to a race in one and two players; photo mode and the other modes are unchecked.",
]

[[section]]
title = "Menus"
items = [
  "Title to race is right; mode, character and vehicle select still need checking screen by screen against the console.",
]

[[section]]
title = "60 fps in races"
items = [
  "A race frame is a chain: the game's frame, then the Vulkan back end records its big submit, then the GPU runs it. Recording is on the critical path, so it needs less CPU.",
  "Done: recording overlapped with the game, submits on their own thread, AMD GPU clocks held on Linux, waits by address, hybrid-CPU core placement (Linux `MKW_FAST_CORES`; Windows `MKW_PCORE` via SelectedCpuSets from totk), the shadow write-back compared with AVX2, texture lock split (`slots_lock` / `view_lock` / `tex_lock`), GPU block-linear deswizzle (`MKW_DESWIZZLE`), sync_ahead scaffolding (`MKW_SYNC_AHEAD`, wait sites still to discover).",
  "Next: hardcode `MKW_SYNC_AHEAD` wait LRs for 1.0.0/1.8.0 (run with `=discover`), the fence's completion work, the kernel's global lock. Profile-guided optimization of the game's code was tried ([#722](https://github.com/adriadam10/mkw-recomp/pull/722)) and gained nothing measurable on a Radeon 660M.",
]

[[section]]
title = "Loading and the player's side"
items = [
  "Less stutter after a race starts: texture deswizzle (CPU workers + GPU `MKW_DESWIZZLE` on live imports) and format scans already run on workers; the many small uploads are left.",
  "A Linux package for non-rolling distributions and the launcher tested on more Windows machines.",
  "A \"Detect\" preset in the graphics settings, chosen from the GPU.",
  "Audio: two known SDK bugs and cuts in the movies' audio.",
]

[[section]]
title = "Game versions"
items = [
  "1.0.0 and 1.8.0 work. Each update is a different executable, so another version needs someone who owns it to run the tools on their own dump and contribute the result ([#19](https://github.com/adriadam10/mkw-recomp/issues/19)).",
  "1.8.0 on par with 1.0.0: ultrawide aspect, shadow map size and fixed seed.",
]
