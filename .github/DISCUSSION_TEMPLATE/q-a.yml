# The Q&A form. Its texts go into the discussion's body, which tools/github/discuss.py reads for failure words: the
# checkbox and field labels stay free of them, or every question would be closed as a bug report.
body:
  - type: markdown
    attributes:
      value: |
        **A crash, an error or a glitch?** Open an [issue with the bug report form](https://github.com/adriadam10/mkw-recomp/issues/new?template=bug_report.yml) and attach `logs/mkw.log`: reports posted here are sent there and closed.
        Many questions are already answered in the [FAQ](https://github.com/adriadam10/mkw-recomp/wiki/FAQ) (skipping the start screen, game versions, updating, saves, online play) and in [Troubleshooting](https://github.com/adriadam10/mkw-recomp/wiki/Troubleshooting).
  - type: checkboxes
    attributes:
      label: Before asking
      options:
        - label: I read the FAQ and searched the earlier discussions
          required: true
  - type: input
    attributes:
      label: Release
      description: The mkw-recomp release you use (the start screen shows it), if it matters
      placeholder: v0.1.13
  - type: textarea
    attributes:
      label: Question
    validations:
      required: true
