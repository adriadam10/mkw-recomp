<!doctype html>
<!-- The phone's side of phonepad.h: a controller in the browser, embedded in the runtime by phonepad_srv.c.
     One file, nothing fetched from elsewhere: the phone may have no internet, only the PC's Wi-Fi.
     What it sends and why it POSTs instead of holding a WebSocket: phonepad_proto.h. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>MKW Recomp</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}

  font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}

  transform:rotate(var(--rot));padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  display:grid;grid-template-columns:1fr minmax(120px,calc(var(--pw)*22)) 1fr;grid-template-rows:calc(var(--ph)*15) 1fr;gap:calc(var(--ph)*1.5) calc(var(--pw)*1.2)}

#top{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr minmax(120px,calc(var(--pw)*22)) 1fr 1fr;gap:calc(var(--pw)*1.2)}

#dpad [data-b="12"]{left:0;top:33%}#dpad [data-b="13"]{right:0;top:33%}

.sheet h1{margin:0;font-size:22px}.sheet p{margin:0;max-width:560px;font-weight:500;color:#c9cdd4;line-height:1.35}
.btn{padding:14px 26px;border-radius:14px;border:0;background:#e0202b;color:#fff;font-family:inherit;font-size:18px;font-weight:700}
.btn.alt{background:#2a2f38}
#code{font:700 34px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.35em;width:6.2em;text-align:center;padding:8px 0 8px .35em;
  border-radius:12px;border:2px solid #e0202b;background:#0e0f12;color:#fff;-webkit-user-select:text;user-select:text}
#set{align-items:stretch;justify-content:flex-start;overflow:auto;text-align:left;gap:10px}

body.c1 #pad{grid-template-columns:1fr calc(var(--pw)*34) 1fr;grid-template-rows:calc(var(--ph)*17) 1fr}
body.c1 #top .b,body.c1 #zone,body.c1 #base,body.c1 #knob,body.c1 #face,body.c1 #wheel [data-b="4"],body.c1 #mid [data-b="9"]{display:none}
body.c1 #status{grid-column:1/6}body.c1 #bar{visibility:visible;width:min(90%,calc(var(--pw)*40))}body.c1 #flag{width:min(90%,calc(var(--pw)*40))}

<body>
<div id="pad">
  <div id="top">
    <div class="b" data-b="6">ZL</div><div class="b" data-b="4"><span>L<small data-t="item"></small></span></div>
    <div id="status"><b id="who">&nbsp;</b><span><span id="net"></span><small id="auto" data-t="auto"></small></span><div id="bar"><i></i></div><div id="flag"></div></div>
    <div class="b" data-b="5"><span>R<small data-t="drift"></small></span></div><div class="b" data-b="7">ZR</div>
  </div>
  <div id="left">
    <div id="zone"></div><div id="base"></div><div id="knob"></div>
    <div id="wheel">
      <div class="b" data-b="4"><span><span data-t="item"></span><small>L</small></span></div>
      <div class="b" data-b="5"><span><span data-t="drift"></span><small>R</small></span></div>
    </div>
  </div>
  <div id="mid">
    <div class="row"><div class="b" id="bk" data-b="1"><span>B<small data-t="back"></small></span></div><div class="b" data-b="9">&minus;</div>
      <div class="b" id="gear">&#9881;</div><div class="b" data-b="8">+</div><div class="b" id="ok"><span>A<small data-t="ok"></small></span></div></div>
    <div id="dpad">
      <div class="b" data-b="10">&#9650;</div><div class="b" data-b="11">&#9660;</div>
      <div class="b" data-b="12">&#9664;</div><div class="b" data-b="13">&#9654;</div>
    </div>
  </div>
  <div id="right"><div class="b" id="big" data-b="4"><span><span data-t="item"></span><small>L</small></span></div><div id="face">
    <div class="b" data-b="2">X</div><div class="b" data-b="3">Y</div>
    <div class="b" data-b="0">A</div><div class="b" data-b="1">B</div>
  </div></div>
</div>

<div class="sheet show" id="start">
  <h1>MKW Recomp</h1>
  <p data-t="intro"></p>
  <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000">
  <p id="err" style="color:#fca5a5;min-height:1.3em"></p>
  <button class="btn" id="go" data-t="start"></button>
</div>

<div class="sheet" id="set">
  <label><span data-t="pad"></span><span class="row" style="flex:1;max-width:60%">
    <button class="btn alt" id="p1" data-t="simple"></button><button class="btn alt" id="p2" data-t="complete"></button></span></label>
  <label id="modeRow"><span data-t="mode"></span><span class="row" style="flex:1;max-width:60%">
    <button class="btn alt" id="mWheel" data-t="wheel"></button><button class="btn alt" id="mStick" data-t="stick"></button></span></label>
  <label><span><span data-t="angle"></span> <b id="angV"></b></span><input type="range" id="ang" min="15" max="60" step="5"></label>
  <label><span data-t="invert"></span><input type="checkbox" id="inv"></label>
  <label><span data-t="buzz"></span><input type="checkbox" id="vib"></label>
  <label><span data-t="tilt"></span><b id="tiltV">&ndash;</b></label>
  <div class="row"><button class="btn alt" id="centre" data-t="centre"></button><button class="btn alt" id="full" data-t="full"></button>
    <button class="btn" id="done" data-t="done"></button></div>
</div>

<script>
(() => {
'use strict';
const es = (navigator.language || '').toLowerCase().startsWith('es');
const T = es ? {
  intro: 'Tu teléfono es un mando. Escribe el código que muestra el juego (Ajustes › Controles) y sujétalo en horizontal, como un volante.',
  start: 'Empezar', item: 'Objeto', drift: 'Derrape', mode: 'Dirección', wheel: 'Volante', stick: 'Palanca',
  angle: 'Giro máximo', invert: 'Invertir el giro', buzz: 'Vibración', tilt: 'Inclinación ahora', centre: 'Centrar',
  full: 'Pantalla completa', done: 'Listo', pad: 'Mando', simple: '1 · Simple', complete: '2 · Completo',
  auto: 'Acelera solo', ok: 'Aceptar', back: 'Atrás · freno',
  joining: 'Conectando…', lost: 'Sin conexión', full503: 'Ya hay ocho mandos conectados.', wait: 'Demasiados intentos: espera diez segundos.',
  bad: 'Ese código no es el del juego.', player: 'Jugador ', ready: 'Conectado',
  nosense: 'Este navegador no entrega los sensores de movimiento: no hay volante.',
} : {
  intro: 'Your phone is a controller. Type the code the game shows (Settings › Controls) and hold it sideways, like a steering wheel.',
  start: 'Start', item: 'Item', drift: 'Drift', mode: 'Steering', wheel: 'Wheel', stick: 'Stick',
  angle: 'Full lock at', invert: 'Invert steering', buzz: 'Vibration', tilt: 'Tilt now', centre: 'Centre',
  full: 'Full screen', done: 'Done', pad: 'Controller', simple: '1 · Simple', complete: '2 · Full',
  auto: 'Auto-accelerate', ok: 'Accept', back: 'Back · brake',
  joining: 'Connecting…', lost: 'No connection', full503: 'Eight controllers are connected already.', wait: 'Too many tries: wait ten seconds.',
  bad: 'That is not the game\'s code.', player: 'Player ', ready: 'Connected',
  nosense: 'This browser does not hand over the motion sensors: there is no wheel.',
};
document.documentElement.lang = es ? 'es' : 'en';
document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t]; });
const $ = id => document.getElementById(id);
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem('mkw.' + k); localStorage.setItem('mkw.' + k, v); } catch (e) {} return null; };

// ---- settings: kept on the phone
const cfg = { pad: store('pad') === '2' ? 2 : 1, wheel: store('wheel') !== '0', angle: +(store('angle') || 35), invert: store('invert') === '1', vib: store('vib') !== '0', centre: +(store('centre') || 0) };
let client = store('id');   // this page's own id: a reload gets the same controller, so the same player
if (!/^[0-9a-f]{16}$/.test(client || '')) {
  client = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
  store('id', client);
}

// ---- touch: every finger presses the button under it and may slide onto the next; one finger owns the stick
const held = new Map();   // pointer id -> {el} or {stick, ox, oy}
let stick = [0, 0], wake = null;
const poke = () => { if (wake) { const w = wake; wake = null; w(); } };
const buttonAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('#pad [data-b]') : null; };
function paint() {
  const on = new Set();
  held.forEach(h => { if (h.el) on.add(h.el); });
  document.querySelectorAll('#pad [data-b]').forEach(el => el.classList.toggle('on', on.has(el)));
}
function moveStick(h, x, y) {
  const r = $('base').offsetWidth * 0.5 || 1;
  let dx = (x - h.ox) / r, dy = (y - h.oy) / r;
  if (rot) [dx, dy] = rot > 0 ? [dy, -dx] : [-dy, dx];   // the pad is drawn turned (place): the finger's move in its axes
  const m = Math.hypot(dx, dy);
  if (m > 1) dx /= m, dy /= m;
  stick = [dx, -dy];
  $('knob').style.transform = `translate(${dx * r}px,${dy * r}px)`;
}
const pad = $('pad');
pad.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.target.id === 'gear') { openSettings(); return; }
  if (e.target.closest('#ok')) {   // pad 1's Accept: see packet
    okAt = performance.now();
    $('ok').classList.add('on');
    setTimeout(() => { $('ok').classList.remove('on'); poke(); }, OK_MS);
    poke();
    return;
  }
  if (e.target.id === 'zone' && ![...held.values()].some(h => h.stick)) {
    const z = $('zone').getBoundingClientRect();
    const h = { stick: true, ox: z.left + z.width / 2, oy: z.top + z.height / 2 };
    held.set(e.pointerId, h);
    moveStick(h, e.clientX, e.clientY);
  } else {
    const el = buttonAt(e.clientX, e.clientY);
    if (el) held.set(e.pointerId, { el });
    if (el && cfg.vib && navigator.vibrate) navigator.vibrate(8);
  }
  paint(); poke();
});
document.addEventListener('pointermove', e => {
  const h = held.get(e.pointerId);
  if (!h) return;
  if (h.stick) moveStick(h, e.clientX, e.clientY);
  else { const el = buttonAt(e.clientX, e.clientY); if (el && el !== h.el) { h.el = el; paint(); } }
  poke();
});
const lift = e => {
  const h = held.get(e.pointerId);
  if (!h) return;
  held.delete(e.pointerId);
  if (h.stick) { stick = [0, 0]; $('knob').style.transform = ''; }
  paint(); poke();
};
document.addEventListener('pointerup', lift);
document.addEventListener('pointercancel', lift);
document.addEventListener('contextmenu', e => e.preventDefault());
// No zoom. Safari on iOS zooms on a double tap and on a pinch whatever the viewport asks, and two thumbs on two
// buttons are both to it: the page grew and stopped answering (an iPhone, 14/11/2026). touch-action: none on every
// element says so in CSS; refusing the touch events' default takes the double tap away, and Safari's own gesture
// events the pinch. The sheets keep their taps and their scroll (pan-y, which allows no zoom either).
const onPad = e => { const el = e.target.nodeType === 1 ? e.target : e.target.parentElement; return !el || !el.closest('.sheet'); };
for (const type of ['touchstart', 'touchmove', 'touchend'])
  document.addEventListener(type, e => { if (onPad(e)) e.preventDefault(); }, { passive: false });
for (const type of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'])
  document.addEventListener(type, e => e.preventDefault(), { passive: false });
const letGo = () => { held.clear(); stick = [0, 0]; $('knob').style.transform = ''; paint(); };

// ---- where the pad is: drawn as the phone is held, whichever way the page stands
// A phone turned far as a wheel is upright to its system, which turns the page: on an iPhone the pad then stood on
// its side under a "turn the phone" sheet and took no input until the wheel came back (in a race, 14/11/2026), and a
// page cannot stop Safari from turning it (screen.orientation.lock is Android's). So while the page stands upright
// the pad is drawn turned a quarter, where it was on the phone, and the sensors keep the pad's axes; a phone whose
// rotation is locked plays the same way. side: which way the phone lies, 90 its top to the left, 270 to the right:
// the page's own angle while it lies sideways, and gravity while it does not (the push along the phone's x: the
// wheel's whole travel, a quarter turn each way, never changes its sign).
const turned = () => (screen.orientation && typeof screen.orientation.angle === 'number' ? screen.orientation.angle
  : ((+window.orientation || 0) + 360) % 360);
let side = 90, lean = 1, rot = 0, placed = '';
function place() {
  const a = turned(), tall = innerHeight > innerWidth, st = document.documentElement.style;
  if (a === 90 || a === 270) side = a, lean = a === 90 ? 1 : -1;
  const now = [a, innerWidth, innerHeight, side].join();
  if (now === placed) return;
  placed = now;
  rot = !tall ? 0 : (side === 90 ? 90 : -90) * (a === 180 ? -1 : 1);
  st.setProperty('--pw', (tall ? innerHeight : innerWidth) / 100 + 'px');   // in pixels: Safari's bars are not in vh
  st.setProperty('--ph', (tall ? innerWidth : innerHeight) / 100 + 'px');
  st.setProperty('--rot', rot + 'deg');
  document.body.classList.toggle('r90', rot === 90);
  document.body.classList.toggle('r270', rot === -90);
}
addEventListener('resize', place);   // and on the page's timer below: Safari's event can come before the new size
place();

// ---- motion: the phone in landscape as the controller (phonepad_proto.h's axes), and the wheel's angle from gravity
// Browsers do not agree on the acceleration's sign (Chrome on Android reports the push against gravity, +9.81 on z
// lying screen up, as the specification says; Safari on iOS the opposite). The picture tells: while the page lies
// sideways the system has turned it until its top is up, so the push points to the screen's top (the phone upright)
// or out of the screen (lying down), and a browser that reports it the other way round is flipped. vote: the last
// half second's verdict, so a shake does not flip it; before any (a page that never lies sideways: the rotation
// locked), the browser's name stands in.
let acc = [0, 0, 9.80665], gyro = [0, 0, 0], sensed = false, tilt = 0, tiltAt = 0, voted = false;
let vote = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? -1 : 1;
// the right and up of a screen at that angle, in the phone's own axes: a quarter turn either way, or upside down
const axes = (angle, x, y) => angle === 90 ? [-y, x] : angle === 270 ? [y, -x] : angle === 180 ? [-x, -y] : [x, y];
function onMotion(e) {
  const g = e.accelerationIncludingGravity, r = e.rotationRate || {};
  if (!g || g.x == null) return;
  // rotationRate's alpha, beta and gamma are the rates about the phone's x, y and z, in deg/s: not the axes the
  // orientation angles of the same names turn about (alpha about z). Measured on an iPhone, 14/11/2026: with alpha
  // taken as z, turning it like a wheel showed about the screen's right edge. With x, y, z, the matrix that best
  // explains how gravity's direction turned over 104 windows of a 50 Hz recording is the identity to within 0.25
  // off the diagonal, with 1.03, 0.95 and 1.44 on it: the order, the three signs and the unit are right.
  const x = g.x, y = g.y, wx = r.alpha || 0, wy = r.beta || 0, wz = r.gamma || 0, k = Math.PI / 180;
  const a = turned();
  if (a === 90 || a === 270) {
    const up = axes(a, x, y)[1] + g.z / 2;
    if (Math.abs(up) > 4) vote = voted ? vote + (Math.sign(up) - vote) * 0.03 : Math.sign(up), voted = true;
  }
  const s = vote < 0 ? -1 : 1;
  if (rot) {   // the page stands upright: gravity says which way the phone lies
    if (Math.abs(x) > 5) lean += (Math.sign(x * s) - lean) * 0.03;
    const now = lean > 0.5 ? 90 : lean < -0.5 ? 270 : side;
    if (now !== side) side = now, place();
  }
  const pa = ((a + rot) % 360 + 360) % 360;   // the pad's own angle on the phone
  const [lx, ly] = axes(pa, x * s, y * s), [vx, vy] = axes(pa, wx, wy), z = g.z * s;
  acc = [lx, ly, z];
  gyro = [vx * k, vy * k, wz * k];
  // The wheel's angle from where gravity's push points. Held upright and turned like a wheel (about the line out of
  // the screen), the push swings between the screen's top and its left: atan2 gives the turn, however far back the
  // phone leans. Held flat and tipped sideways like a tray, it swings between out of the screen and the left: asin
  // gives the tip. Each is wrong for the other hold (the first has no reading lying flat, the second reads a wheel
  // leaning back 45 degrees a third short), so they are mixed by how upright the screen's top edge stands.
  const n = Math.hypot(lx, ly, z) || 1, upright = Math.abs(ly) / (Math.hypot(ly, z) || 1), deg = 180 / Math.PI;
  const spin = Math.atan2(-lx, Math.abs(ly)) * deg, tip = Math.asin(Math.max(-1, Math.min(1, -lx / n))) * deg;
  const t = upright * spin + (1 - upright) * tip;
  const now = performance.now(), dt = Math.min(100, now - tiltAt);
  tiltAt = now;
  tilt = sensed ? tilt + (t - tilt) * (1 - Math.exp(-dt / 40)) : t;   // 40 ms: the hand's tremor, not its turn
  sensed = true;
  poke();
}
function steer() {   // -1..1 from the wheel
  if (!(cfg.pad === 1 || cfg.wheel) || !sensed) return 0;
  let d = (tilt - cfg.centre) * (cfg.invert ? -1 : 1);
  const dead = 2;
  d = Math.abs(d) < dead ? 0 : (d - Math.sign(d) * dead) / (cfg.angle - dead);
  return Math.max(-1, Math.min(1, d));
}
function askMotion() {   // Safari asks the player here; a browser that refuses simply sends no events
  if (typeof DeviceMotionEvent === 'undefined') return;
  try { if (DeviceMotionEvent.requestPermission) DeviceMotionEvent.requestPermission().catch(() => {}); } catch (e) {}
  addEventListener('devicemotion', onMotion);
}

// ---- the link: one POST at a time; a pressed button goes at once, the sensors 60 times a second
let started = false, sid = null, code = (location.hash.match(/\d{4}/) || [store('code') || ''])[0], lag = 0, rumbleAt = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const idle = ms => new Promise(r => { const t = setTimeout(() => { wake = null; r(); }, ms); wake = () => { clearTimeout(t); r(); }; });
const say = (who, net) => { if (who !== null) $('who').textContent = who; $('net').textContent = net; };
// Pad 1 holds the accelerator for the player: a kart needs it all the time, and on glass a thumb is better spent on
// the drift. A is let go while B is held (the brake, and Back in a menu) and for an instant when Accept is touched:
// a menu takes a button going down, and one that is always down never does.
const OK_MS = 120;
let okAt = -1e9;
function packet() {
  const d = new DataView(new ArrayBuffer(24)), i16 = v => Math.max(-32767, Math.min(32767, Math.round(v)));
  let b = 0;
  held.forEach(h => { if (h.el) b |= 1 << +h.el.dataset.b; });
  const s = steer();
  let lx = Math.abs(stick[0]) > Math.abs(s) ? stick[0] : s;
  if (cfg.pad === 1 && !$('set').classList.contains('show')) {
    if (!(b & 2) && performance.now() - okAt >= OK_MS) b |= 1;
    if (!sensed) lx = (b >> 13 & 1) - (b >> 12 & 1);   // no sensors: the cross steers
  }
  d.setUint8(0, 1); d.setUint8(1, sensed ? 1 : 0); d.setUint16(2, b, true);
  d.setInt16(4, i16(lx * 32767), true); d.setInt16(6, i16(stick[1] * 32767), true);
  for (let i = 0; i < 3; i++) { d.setInt16(12 + i * 2, i16(acc[i] * 500), true); d.setInt16(18 + i * 2, i16(gyro[i] * 1000), true); }
  $('bar').firstChild.style.left = (50 + s * 50) + '%';
  return d;
}
async function join() {
  say(null, T.joining);
  const r = await fetch(`/join?code=${code}&id=${client}`, { method: 'POST', cache: 'no-store' });
  if (r.status === 200) { sid = await r.text(); store('code', code); say(T.ready, ''); return; }
  if (r.status === 403) {
    sid = null; code = ''; started = false;
    $('err').textContent = T.bad; $('start').classList.add('show');
    throw 0;
  }
  say(null, r.status === 503 ? T.full503 : T.wait);
  await sleep(2000);
}
async function link() {
  let last = '', sent = 0;
  for (;;) {
    try {
      if (document.hidden || !started || !code) { await sleep(300); continue; }
      if (!sid) { await join(); continue; }
      const d = packet(), key = d.getUint16(2) + ',' + d.getInt16(4) + ',' + d.getInt16(6), now = performance.now();
      // a button or the stick changed: now. Sensors alone: every 16 ms. Nothing: every 200 ms, so the PC knows we are here
      if (key === last && now - sent < (sensed ? 16 : 200)) { await idle(sensed ? 16 - (now - sent) : 200 - (now - sent)); continue; }
      const r = await fetch('/i?s=' + sid, { method: 'POST', body: d.buffer, cache: 'no-store' });
      if (r.status === 410) { sid = null; continue; }
      if (!r.ok) throw 0;
      const f = new Uint8Array(await r.arrayBuffer()), done = performance.now();
      last = key; sent = now;
      lag += (done - now - lag) * 0.1;
      say(f[2] ? T.player + f[2] : T.ready, Math.round(lag) + ' ms');
      if ((f[0] > 12 || f[1] > 12) && cfg.vib && navigator.vibrate && done - rumbleAt > 80) { rumbleAt = done; navigator.vibrate(110); }
    } catch (e) {
      if (!started) continue;
      say(null, T.lost);
      await sleep(600);
    }
  }
}
addEventListener('pagehide', () => { if (sid && navigator.sendBeacon) navigator.sendBeacon('/bye?s=' + sid); });
document.addEventListener('visibilitychange', () => { letGo(); if (!document.hidden) awake(); });
let lock = null;
async function awake() { try { if (navigator.wakeLock && (!lock || lock.released)) lock = await navigator.wakeLock.request('screen'); } catch (e) {} }

// ---- the sheets
const mode = () => {
  document.body.classList.toggle('c1', cfg.pad === 1);
  document.body.classList.toggle('wheel', cfg.pad === 2 && cfg.wheel && sensed);
  $('p1').style.background = cfg.pad === 1 ? '#e0202b' : ''; $('p2').style.background = cfg.pad === 2 ? '#e0202b' : '';
  $('modeRow').style.display = cfg.pad === 1 ? 'none' : '';
  $('mWheel').style.background = cfg.wheel ? '#e0202b' : ''; $('mStick').style.background = cfg.wheel ? '' : '#e0202b';
};
mode();
function openSettings() {
  letGo();
  $('ang').value = cfg.angle; $('angV').textContent = cfg.angle + '°'; $('inv').checked = cfg.invert; $('vib').checked = cfg.vib;
  $('full').style.display = document.fullscreenEnabled ? '' : 'none';
  mode();
  $('set').classList.add('show');
}
setInterval(() => { if ($('set').classList.contains('show')) $('tiltV').textContent = sensed ? Math.round(tilt - cfg.centre) + '°' : T.nosense; mode(); place(); }, 150);
$('p1').onclick = () => { cfg.pad = 1; store('pad', '1'); mode(); };
$('p2').onclick = () => { cfg.pad = 2; store('pad', '2'); mode(); };
$('mWheel').onclick = () => { cfg.wheel = true; store('wheel', '1'); mode(); };
$('mStick').onclick = () => { cfg.wheel = false; store('wheel', '0'); mode(); };
$('ang').oninput = e => { cfg.angle = +e.target.value; store('angle', cfg.angle); $('angV').textContent = cfg.angle + '°'; };
$('inv').onchange = e => { cfg.invert = e.target.checked; store('invert', cfg.invert ? '1' : '0'); };
$('vib').onchange = e => { cfg.vib = e.target.checked; store('vib', cfg.vib ? '1' : '0'); };
$('centre').onclick = () => { cfg.centre = Math.round(tilt * 10) / 10; store('centre', cfg.centre); };
// Android: the address bar goes and the page lies sideways whatever the phone's rotation lock says. An iPhone has
// neither call: its page turns with the phone, and the pad is drawn where it was (place).
async function goFull() {
  try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); await screen.orientation.lock('landscape'); } catch (e) {}
}
$('full').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else goFull(); };
$('done').onclick = () => $('set').classList.remove('show');

$('code').value = code;
$('go').onclick = () => {
  askMotion();   // first, inside the tap: Safari only asks for the sensors from one
  const v = $('code').value.trim();
  if (!/^\d{4}$/.test(v)) { $('err').textContent = T.bad; return; }
  code = v; $('err').textContent = '';
  $('start').classList.remove('show');
  started = true;
  awake();
  goFull();
};
link();
})();
</script>
</body>
